# Pruebas de extremo a extremo con Playwright (criterio 6; specs/007-tablero-despliegue, research §R-11).
# Corren contra el mismo docker compose de desarrollo, en tamaño celular y de escritorio. NO es uno de
# los 5 checks obligatorios de `main` (aclaración del 2026-11-20): su resultado se ve en el PR.
name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Valores FICTICIOS de .env.example: el compose de desarrollo ya los trae por defecto.
      RELOJ_PLAZOS_INTERVALO_MS: '0'
      # El E2E lee el código de Redis con el envío simulado (aclaración del 2026-11-23 de la 009); el
      # buzón de pruebas es para las personas que prueban por el enlace.
      ENVIO_OTP: simulado
      ENVIO_AVISOS: simulado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Levantar el sistema
        run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - name: Recorridos de las rutas A y B (celular y escritorio)
        run: npm run e2e
      # 011 (T035, FR-018 y EQ-05): Lighthouse móvil a 360×740 en pantallas con sesión, con la misma
      # medida de calidad-produccion.yml (accesibilidad ≥ 0.9). El puppeteerScript ingresa con el código
      # simulado, que en producción llega por SMS. puppeteer se usa con npx y una versión fija (no va
      # al package.json); usa el Chrome del runner.
      - name: Lighthouse móvil con sesión (/perfil y /cambiar-clave)
        if: ${{ !cancelled() }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          lhci() { npx --yes -p @lhci/cli@0.14.0 -p puppeteer@23.11.1 lhci "$@" --config=tests/e2e/lighthouserc.json; }
          lhci collect
          lhci upload
          lhci assert
      # 012 (T054, SC-007): accesibilidad del chat de orientación ABIERTO con Lighthouse en modo
      # snapshot (un flujo de puppeteer abre "Pregúntanos" sin recargar). lighthouse y puppeteer-core
      # se instalan con versiones fijas en una carpeta temporal; no van al package.json. No usa al
      # proveedor de IA (solo abre el chat).
      - name: Lighthouse del chat de orientación abierto (snapshot)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/lighthouse-chat
          cp tests/e2e/apoyo/lighthouse-chat.mjs /tmp/lighthouse-chat/
          cd /tmp/lighthouse-chat
          npm init -y > /dev/null
          npm install --no-audit --no-fund lighthouse@12.2.1 puppeteer-core@23.11.1
          # 013 (T044): en modo claro y oscuro; los dos deben tener accesibilidad >= 0.9.
          for modo in claro oscuro; do
            node lighthouse-chat.mjs --url http://localhost:8080/ --salida "$GITHUB_WORKSPACE/tests/e2e/lighthouse" --chrome /usr/bin/google-chrome --modo "$modo"
          done
      - name: Registros del sistema si falla
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color api web > sistema.log
      - name: Informe y evidencias
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-informe
          path: |
            tests/e2e/informe
            tests/e2e/resultados
            sistema.log
          retention-days: 7
      - name: Informes de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-011
          path: |
            tests/e2e/lighthouse
            .lighthouseci
          retention-days: 90
      - name: Bajar el sistema
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
