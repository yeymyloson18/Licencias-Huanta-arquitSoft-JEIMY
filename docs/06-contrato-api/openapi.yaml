openapi: 3.1.0
info:
  title: API del Sistema de Trámite de Licencias de Funcionamiento – Municipalidad Provincial de Huanta
  version: 1.0.0
  description: |
    Contrato REST (RC08) entre el Portal Web y el Backend NestJS. Es la fuente única de verdad:
    el backend se valida contra este archivo y el frontend genera su cliente a partir de él.

    **Tres formas de acceso**
    - `bearerPersonal`: JWT del personal municipal, obtenido con usuario, clave y OTP (RF16). El rol viaja en el token (RF17).
    - `tokenIdentidad`: JWT de 30 minutos que recibe el administrado después de validar su DNI/RUC y su celular con OTP (RF06). Solo sirve para presentar o subsanar una solicitud.
    - `tokenConsulta`: JWT de 15 minutos que recibe el administrado al consultar con número de expediente + DNI/RUC (RF03). Solo sirve para leer su expediente y descargar su esquela o su licencia.

    **Reglas generales**
    - Prefijo de versión: `/api/v1`.
    - Los datos personales nunca viajan en la URL ni en parámetros de consulta: se envían en el cuerpo (POST).
    - Errores en formato `application/problem+json` (RFC 9457) sin datos personales (EQ-04).
    - Límite de intentos: 5 intentos fallidos en 15 minutos bloquean temporalmente (respuesta 429, ADR-007).
    - Listados paginados con `pagina` y `porPagina` (máximo 100).
  contact:
    name: Jeimy Gregori Sulca Ccorimanya
  license:
    name: Uso académico – UNSCH 2026
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local (Docker Compose)
  - url: https://api.licencias.example.pe/api/v1
    description: Producción (dominio por definir con la Municipalidad)

tags:
  - name: Seguridad
    description: Inicio de sesión del personal, OTP y verificación de identidad del administrado
  - name: Usuarios
    description: Gestión del personal y sus roles (administrador)
  - name: Catálogo
    description: Recetas del TUPA y asistente de ruta
  - name: Trámites
    description: Presentación, evaluación y consulta de expedientes
  - name: Pagos
    description: Esquelas de pago y registro en caja
  - name: Inspecciones
    description: Inspecciones ITSE desde el celular
  - name: Licencias
    description: Licencias emitidas y verificación pública del QR
  - name: Plazos
    description: Feriados y alertas de vencimiento
  - name: Reportes
    description: Tablero y reportes de la jefatura
  - name: Operación
    description: Salud del servicio para el balanceador y el monitoreo

paths:
  # ===================================================================== SEGURIDAD
  /auth/iniciar-sesion:
    post:
      tags: [Seguridad]
      operationId: iniciarSesion
      summary: Paso 1 del inicio de sesión del personal. Valida correo y clave, y envía un OTP por SMS (RF16).
      description: |
        Antes de comprobar las credenciales se revisan los límites (5 fallos en 15 minutos por correo y
        por origen; 3 códigos por usuario en 15 minutos): si se superaron, responde 429 aunque los datos
        sean correctos. Correo inexistente, usuario inactivo y clave incorrecta responden el mismo 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialesPersonal' }
      responses:
        '200':
          description: Credenciales correctas; se envió el código OTP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesafioOtp' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /auth/verificar-otp:
    post:
      tags: [Seguridad]
      operationId: verificarOtpPersonal
      summary: Paso 2 del inicio de sesión. Verifica el OTP, entrega el token de acceso y deja el refresh token en una cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificacionOtp' }
      responses:
        '200':
          description: Sesión iniciada. El refresh token viaja solo en la cookie `refresh_personal`.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionPersonal' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /auth/renovar:
    post:
      tags: [Seguridad]
      operationId: renovarSesion
      summary: Renueva el token de acceso con la cookie `refresh_personal` y la rota.
      description: |
        Sin cuerpo. Responde 401 si la cookie falta, la sesión fue revocada, pasaron 8 horas desde el
        inicio de sesión o más de 30 minutos desde la última renovación. Reutilizar una cookie ya rotada
        (más de 10 segundos después de la rotación) cierra todas las sesiones del usuario.
      security: [{ cookieRefresh: [] }]
      responses:
        '200':
          description: Nuevo token de acceso; la cookie se reemplaza por una nueva (rotación).
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionPersonal' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /auth/cerrar-sesion:
    post:
      tags: [Seguridad]
      operationId: cerrarSesion
      summary: Cierra la sesión de la cookie `refresh_personal`; su token de acceso deja de servir al instante.
      description: Idempotente. Funciona aunque el token de acceso haya vencido.
      security: [{ cookieRefresh: [] }]
      responses:
        '204':
          description: Sesión cerrada; la cookie se borra.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookieRefresh' }

  /auth/cambiar-clave:
    post:
      tags: [Seguridad]
      operationId: cambiarClave
      summary: Cambia la clave del usuario autenticado; obligatorio cuando la clave es temporal (FR-022).
      description: |
        Única operación permitida con `debeCambiarClave = true`. La clave actual incorrecta cuenta como
        intento fallido. Al terminar se cierran las demás sesiones del usuario y se entrega un token nuevo.
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioClave' }
      responses:
        '200':
          description: Clave cambiada; nuevo token de acceso y cookie rotada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionPersonal' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }

  /identidad/verificar:
    post:
      tags: [Seguridad]
      operationId: verificarIdentidadAdministrado
      summary: Valida RUC y DNI (con fecha de emisión) o carné de extranjería con el servicio externo, y envía un OTP al celular (RF06).
      description: >-
        Si actúa un representante, el servicio comprueba también su documento (RF06, ADR-007). Si los datos
        no coinciden responde 422 con el mismo mensaje para cualquier dato (FR-007). Repetir la verificación
        con los mismos datos crea un desafío nuevo (otro código) y cuenta para el límite de 3 envíos por
        celular en 15 minutos. Todas las respuestas llevan `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudVerificacionIdentidad' }
      responses:
        '200':
          description: Identidad válida; se envió el OTP.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesafioOtp' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }
        '503':
          description: El servicio de validación de DNI/RUC no está disponible. El administrado puede acudir a mesa de partes (RC12).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /identidad/verificar-otp:
    post:
      tags: [Seguridad]
      operationId: verificarOtpAdministrado
      summary: Verifica el OTP del administrado y entrega el token de identidad (30 minutos).
      description: >-
        El token (`expiraEn = 1800`) sirve para subir documentos y presentar **una sola** solicitud
        (aclaración 2 de la 004); no se acepta como token del personal ni al revés. Un código incorrecto,
        vencido o de un desafío reemplazado responde 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificacionOtp' }
      responses:
        '200':
          description: Identidad confirmada.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCorto' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }

  # ===================================================================== USUARIOS
  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Lista el personal (rol ADMINISTRADOR).
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - name: activo
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    required: [datos]
                    properties:
                      datos:
                        type: array
                        items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Crea un usuario del personal (RF22).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoUsuario' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: El correo ya está en uso (`type` termina en `correo-en-uso`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /usuarios/busqueda:
    post:
      tags: [Usuarios]
      operationId: buscarUsuarios
      summary: Busca personal por un fragmento del nombre o por el correo completo (rol ADMINISTRADOR).
      description: |
        Usa POST para que el texto buscado (un dato personal) no aparezca en la URL, los logs ni el
        historial del navegador (Ley N.° 29733).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusquedaUsuarios' }
      responses:
        '200':
          description: Página de usuarios que coinciden.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    required: [datos]
                    properties:
                      datos:
                        type: array
                        items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /usuarios/{usuarioId}:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Cambia el nombre, el celular o activa/desactiva un usuario (RF22). El correo no se puede cambiar.
      description: Desactivar a un usuario cierra al instante todas sus sesiones (FR-011).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                nombreCompleto: { type: string, minLength: 3, maxLength: 150 }
                celular: { $ref: '#/components/schemas/Celular' }
                activo: { type: boolean }
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/UltimoAdministrador' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /usuarios/{usuarioId}/roles:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Usuarios]
      operationId: asignarRoles
      summary: Reemplaza los roles vigentes de un usuario (RF17, RF22).
      description: |
        Los roles que dejan de estar se marcan como retirados (quién y cuándo) y se conservan en el
        historial (FR-019). El cambio vale desde la siguiente operación del usuario (FR-015).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Rol' }
      responses:
        '200':
          description: Roles asignados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/UltimoAdministrador' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /usuarios/{usuarioId}/clave-temporal:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Usuarios]
      operationId: asignarClaveTemporal
      summary: Asigna una clave temporal a un usuario que olvidó la suya (FR-022b).
      description: |
        La clave anterior deja de servir, se cierran todas las sesiones del usuario y en su siguiente
        ingreso deberá cambiar la clave. El administrador la entrega en persona.
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claveTemporal]
              additionalProperties: false
              properties:
                claveTemporal: { $ref: '#/components/schemas/Clave' }
      responses:
        '204': { description: Clave temporal asignada. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  # ===================================================================== CATÁLOGO
  /catalogo/recetas:
    get:
      tags: [Catálogo]
      operationId: listarRecetas
      summary: Lista las recetas activas del TUPA (público, con caché en Redis y CDN).
      security: []
      parameters:
        - name: tipo
          in: query
          schema: { type: string, enum: [LICENCIA, TRAMITE_CONECTADO] }
      responses:
        '200':
          description: Recetas.
          headers:
            Cache-Control:
              {
                schema: { type: string },
                description: 'public, max-age=60 (Redis guarda 240 s; en total, 5 minutos como máximo; FR-024 de la 003)',
              }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecetaResumen' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /catalogo/recetas/{codigoReceta}:
    parameters:
      - $ref: '#/components/parameters/CodigoReceta'
    get:
      tags: [Catálogo]
      operationId: obtenerReceta
      summary: Requisitos, tasa y plazo de una licencia (RF02, RF05).
      description: Público. Responde 404 si la receta no existe o está desactivada (mismo cuerpo en los dos casos).
      security: []
      responses:
        '200':
          description: Receta completa (requisitos en orden).
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=60' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receta' }
        '404':
          description: La receta no existe o está desactivada.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    put:
      tags: [Catálogo]
      operationId: actualizarReceta
      summary: Actualiza una receta cuando cambia el TUPA, sin programar (RF21, EQ-06). Borra su clave de la caché.
      description: >-
        Solo ADMINISTRADOR. Gana el último que guarda (sin If-Match). Si no hay cambios reales, responde
        200 con la receta actual y no registra nada. Cada cambio queda en el registro de cambios de la
        receta, en la misma transacción (FR-021).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecetaEditable' }
      responses:
        '200':
          description: Receta actualizada.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecetaAdmin' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /asistente/preguntas:
    get:
      tags: [Catálogo]
      operationId: obtenerPreguntasAsistente
      summary: Las preguntas del asistente de ruta, con sus opciones tal como están en el catálogo (RF01).
      security: []
      responses:
        '200':
          description: Preguntas en orden.
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=60' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PreguntaAsistente' }

  /asistente/proponer:
    post:
      tags: [Catálogo]
      operationId: proponerLicencia
      summary: Propone la licencia según las respuestas y devuelve requisitos, tasa y plazo (RF01, RF02).
      description: >-
        Evalúa las reglas por prioridad y toma la primera que coincide. Si ninguna coincide, o si la
        receta propuesta está desactivada, responde 200 con resultado NO_DETERMINADA. 422 solo para
        respuestas inválidas (falta una pregunta, sobra un código o un valor no está entre las opciones).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas:
                  type: object
                  description: Código de pregunta → valor elegido.
                  additionalProperties: { type: string }
                  example: { TIPO_ESTABLECIMIENTO: OTRO, ES_CESIONARIO: 'NO', NIVEL_RIESGO: MEDIO }
      responses:
        '200':
          description: Licencia propuesta o aviso de que no se pudo determinar.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoAsistente' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /admin/catalogo/recetas:
    get:
      tags: [Catálogo]
      operationId: listarRecetasAdmin
      summary: Las recetas del catálogo, activas y desactivadas, ordenadas por código (RF21).
      description: Solo ADMINISTRADOR.
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Recetas.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecetaAdminResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /admin/catalogo/recetas/{codigoReceta}:
    parameters:
      - $ref: '#/components/parameters/CodigoReceta'
    get:
      tags: [Catálogo]
      operationId: obtenerRecetaAdmin
      summary: Receta completa para editarla, aunque esté desactivada (RF21).
      description: Solo ADMINISTRADOR.
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Receta completa.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecetaAdmin' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ===================================================================== TRÁMITES
  /documentos:
    post:
      tags: [Trámites]
      operationId: subirDocumento
      summary: Sube un archivo antes de presentar o subsanar. Devuelve un id temporal (válido 24 horas).
      description: >-
        Acepta tokenIdentidad (administrado en línea) o bearerPersonal con rol MESA_PARTES (otro rol → 403).
        Solo PDF, JPG o PNG de hasta 10 MB; el tipo se comprueba por el contenido, no por la extensión. El
        documento solo lo puede usar quien lo subió y vence a las 24 horas.
      security: [{ tokenIdentidad: [] }, { bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
            encoding:
              archivo:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        '201':
          description: Archivo recibido.
          content:
            application/json:
              schema:
                type: object
                required: [documentoId, sha256]
                properties:
                  documentoId: { type: string, format: uuid }
                  sha256: { type: string, minLength: 64, maxLength: 64 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '413':
          description: El archivo supera los 10 MB.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '415':
          description: Tipo de archivo no permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /expedientes:
    post:
      tags: [Trámites]
      operationId: presentarSolicitud
      summary: Presenta la solicitud (RF04, RF06, RF07). En línea exige tokenIdentidad; en mesa de partes, bearerPersonal con rol MESA_PARTES.
      description: >-
        En línea, `identidad` debe coincidir con la confirmada (si no, 403) y el permiso sirve para un solo
        expediente (otra solicitud con el mismo permiso → 409). En mesa de partes la identidad se comprueba
        con el servicio sin código (servicio caído → 503). La misma `Idempotency-Key` con el mismo cuerpo
        devuelve 200 con el mismo expediente; con otro cuerpo, 422 en `Idempotency-Key`. Cada requisito
        obligatorio sin documento da un error en `documentos.requisito.<id>`. `Cache-Control: no-store`.
      security: [{ tokenIdentidad: [] }, { bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotenciaObligatoria'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaSolicitud' }
      responses:
        '201':
          description: Expediente registrado. La ruta se asigna según la receta.
          headers:
            Location: { schema: { type: string }, description: URL del expediente }
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteRegistrado' }
        '200':
          description: Reintento con la misma Idempotency-Key y el mismo cuerpo; devuelve el mismo expediente.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteRegistrado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '503':
          description: El servicio de identificación no está disponible (mesa de partes).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    get:
      tags: [Trámites]
      operationId: listarExpedientes
      summary: Bandeja del personal (mesa de partes, evaluador, jefatura).
      description: >-
        Todos los expedientes (aclaración 5 de la 004), del más reciente al más antiguo; `porPagina` hasta 50.
        `asignadosAMi` (006) y `vencenAntesDe` (008) todavía no están disponibles: en la 004 responden 422.
        `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoExpediente' }
        - name: ruta
          in: query
          schema: { $ref: '#/components/schemas/Ruta' }
        - name: asignadosAMi
          in: query
          schema: { type: boolean, default: false }
        - name: vencenAntesDe
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página de expedientes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      datos:
                        type: array
                        items: { $ref: '#/components/schemas/ExpedienteResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /expedientes/consultar:
    post:
      tags: [Trámites]
      operationId: consultarEstado
      summary: Consulta pública del estado con número de expediente + DNI/RUC juntos (RF03, HU05). Límite de 5 intentos fallidos en 15 minutos.
      description: >-
        Si los datos no coinciden (o el número no existe) responde 404 con el mismo cuerpo, sin decir cuál de
        los dos falló (EQ-04). Tras 5 fallos desde el mismo origen en 15 minutos responde 429, también con
        datos correctos (aclaración 1 de la 004). Sin datos personales en la respuesta. `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numeroExpediente, documento]
              properties:
                numeroExpediente: { $ref: '#/components/schemas/NumeroExpediente' }
                documento:
                  type: string
                  description: DNI, carné de extranjería o RUC del titular.
                  pattern: '^[0-9A-Z]{8,12}$'
      responses:
        '200':
          description: Estado del trámite en lenguaje sencillo.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPublico' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }
        '503':
          description: No se pueden contar los intentos en este momento (falla cerrado).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /expedientes/{numeroExpediente}:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    get:
      tags: [Trámites]
      operationId: obtenerExpediente
      summary: Detalle completo del expediente para el personal.
      description: >-
        Roles MESA_PARTES, EVALUADOR y JEFATURA. Registra VER_DETALLE en la auditoría.
        `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Expediente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expediente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /expedientes/{numeroExpediente}/titular:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    get:
      tags: [Trámites]
      operationId: obtenerTitularParaCaja
      summary: Solo el nombre del titular, para que el cajero confirme antes de registrar el pago (RF12, rol CAJA).
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Titular.
          content:
            application/json:
              schema:
                type: object
                required: [numeroExpediente, nombreTitular]
                properties:
                  numeroExpediente: { $ref: '#/components/schemas/NumeroExpediente' }
                  nombreTitular: { type: string }
                  razonSocial: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /expedientes/{numeroExpediente}/evaluacion:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    post:
      tags: [Trámites]
      operationId: iniciarEvaluacion
      summary: El evaluador empieza la revisión (RF09, rol EVALUADOR). REGISTRADO → EN_EVALUACION.
      description: >-
        Registra quién empezó la revisión; cualquier evaluador puede decidir después (aclaración de la 005).
        `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Expediente en evaluación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expediente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/VersionCambiada' }

  /expedientes/{numeroExpediente}/riesgo:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    post:
      tags: [Trámites]
      operationId: confirmarNivelRiesgo
      summary: El evaluador confirma la licencia presentada o la corrige a otra del mismo grupo (RF09, rol EVALUADOR).
      description: >-
        Sin `codigoReceta` se confirma la licencia actual. Con `codigoReceta`, la licencia debe estar vigente y
        ser del mismo grupo (establecimiento, cesionario; la corporativa y la de bodegas no tienen alternativas):
        el expediente toma su ruta y su tasa. El expediente pasa a PENDIENTE_PAGO y se solicita la esquela, que
        queda disponible en segundos; con tasa 0.00 pasa a PAGADO sin esquela. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
                comentario: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Riesgo confirmado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expediente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/VersionCambiada' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /expedientes/{numeroExpediente}/aprobar:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    post:
      tags: [Trámites]
      operationId: aprobarEvaluacion
      summary: Aprueba un expediente PAGADO de ruta A o C y lo deja APROBADO (RF09, rol EVALUADOR).
      description: >-
        La ruta B (inspección previa) y la emisión de la licencia son de la funcionalidad 006.
        `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comentario: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Expediente aprobado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expediente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/VersionCambiada' }

  /expedientes/{numeroExpediente}/observar:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    post:
      tags: [Trámites]
      operationId: observarExpediente
      summary: Observa el expediente por requisitos faltantes (RF09, rol EVALUADOR). Una sola vez por expediente.
      description: >-
        EN_EVALUACION → OBSERVADO. Una segunda observación responde 409 (`type` `ya-observado`). El plazo para
        subsanar es de 2 días hábiles y lo calcula el sistema (006): `plazoSubsanarEn` se acepta pero se ignora. El
        plazo del expediente queda suspendido hasta la subsanación. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descripcion]
              properties:
                descripcion: { type: string, minLength: 10, maxLength: 1000 }
                plazoSubsanarEn:
                  { type: string, format: date, deprecated: true, description: Se ignora desde la 006. }
      responses:
        '200':
          description: Expediente observado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expediente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/VersionCambiada' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /expedientes/{numeroExpediente}/denegar:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    post:
      tags: [Trámites]
      operationId: denegarExpediente
      summary: Deniega el expediente con motivo (RF09, rol EVALUADOR). DENEGADO es un estado final.
      description: >-
        EN_EVALUACION → DENEGADO. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200':
          description: Expediente denegado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expediente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/VersionCambiada' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /expedientes/{numeroExpediente}/subsanar:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    post:
      tags: [Trámites]
      operationId: subsanarObservacion
      summary: Se adjuntan los documentos que faltaban y el expediente vuelve a EN_EVALUACION (CU05).
      description: >-
        En línea, con el `tokenIdentidad` de la identidad confirmada del **titular** (403 si es otra persona,
        sin revelar de quién es el expediente) y la `identidad` en el cuerpo. En mesa de partes, con la sesión
        del rol MESA_PARTES (sin `identidad`). Cada documento se sube antes con `POST /documentos` y se asocia a
        un requisito de la receta guardada al presentar. `Cache-Control: no-store`.
      security: [{ tokenIdentidad: [] }, { bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentos]
              additionalProperties: false
              properties:
                identidad: { $ref: '#/components/schemas/SolicitudVerificacionIdentidad' }
                documentos:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { $ref: '#/components/schemas/DocumentoAdjunto' }
      responses:
        '200':
          description: Observación subsanada; el expediente vuelve a EN_EVALUACION.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteRegistrado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /expedientes/{numeroExpediente}/auditoria:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
    get:
      tags: [Trámites]
      operationId: auditoriaTramites
      summary: Decisiones registradas sobre el expediente (RF25, rol JEFATURA).
      description: >-
        Del más antiguo al más reciente. Cada registro trae el usuario (con su nombre), la acción, la fecha y
        `referencia` = número de expediente; nunca datos personales del titular. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Registro de auditoría.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegistroAuditoria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /expedientes/{numeroExpediente}/documentos/{documentoId}:
    parameters:
      - $ref: '#/components/parameters/NumeroExpediente'
      - name: documentoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites]
      operationId: descargarDocumento
      summary: Descarga un documento adjunto del expediente.
      description: >-
        La API entrega el archivo (el almacén es local hasta la 010). Solo bearerPersonal con los roles de la
        bandeja; `tokenConsulta` se habilita en la 009 (la 005 lo usa solo para la esquela).
      security: [{ bearerPersonal: [] }, { tokenConsulta: [] }]
      responses:
        '200':
          description: El archivo.
          headers:
            Content-Disposition:
              { schema: { type: string }, description: 'attachment; filename="<nombre>"' }
            X-Content-Type-Options: { schema: { type: string }, description: nosniff }
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ===================================================================== PAGOS
  /esquelas/{codigoEsquela}:
    parameters:
      - $ref: '#/components/parameters/CodigoEsquela'
    get:
      tags: [Pagos]
      operationId: consultarEsquela
      summary: El cajero consulta la esquela antes de registrar el pago (RF12, rol CAJA).
      description: >-
        El código se acepta en minúsculas y con espacios alrededor. Trae el estado del expediente y la licencia;
        el nombre del titular se pide aparte (`obtenerTitularParaCaja`). `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Esquela.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Esquela' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /esquelas/{codigoEsquela}/pdf:
    parameters:
      - $ref: '#/components/parameters/CodigoEsquela'
    get:
      tags: [Pagos]
      operationId: descargarEsquela
      summary: PDF de la esquela para pagar en caja (HU04).
      description: >-
        Con el `tokenConsulta` del mismo expediente (de la consulta pública) o una sesión EVALUADOR, CAJA o
        JEFATURA. Responde 202 mientras la esquela todavía no existe (se genera en segundos tras confirmar el
        riesgo). El PDF no lleva datos personales del titular.
      security: [{ tokenConsulta: [] }, { bearerPersonal: [] }]
      responses:
        '200':
          description: PDF.
          headers:
            Content-Disposition:
              { schema: { type: string }, description: 'attachment; filename="<código>.pdf"' }
            X-Content-Type-Options: { schema: { type: string }, description: nosniff }
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '202':
          description: La esquela todavía se está generando; reintentar en unos segundos.
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /esquelas/{codigoEsquela}/pago:
    parameters:
      - $ref: '#/components/parameters/CodigoEsquela'
    post:
      tags: [Pagos]
      operationId: registrarPagoEnCaja
      summary: Registra el pago con el número de recibo (RF12, rol CAJA). Atómico; guarda la auditoría y el evento PagoRegistrado.
      description: >-
        El recibo se normaliza (mayúsculas, sin espacios) antes de validarlo. Una esquela se paga una sola vez,
        aun con pagos simultáneos (409 `esquela-ya-pagada`); un recibo repetido responde 409 `recibo-repetido`;
        un expediente que no está PENDIENTE_PAGO, 409 `transicion-invalida`. `Idempotency-Key` se acepta pero
        no se guarda: un reintento recibe 409 `esquela-ya-pagada`. El expediente pasa a PAGADO en segundos.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numeroRecibo]
              properties:
                numeroRecibo: { $ref: '#/components/schemas/NumeroRecibo' }
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Esquela' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La esquela ya fue pagada, el número de recibo ya existe o el expediente no está esperando el pago.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /esquelas/{codigoEsquela}/recibo:
    parameters:
      - $ref: '#/components/parameters/CodigoEsquela'
    patch:
      tags: [Pagos]
      operationId: corregirNumeroRecibo
      summary: La jefatura corrige un número de recibo mal digitado, con motivo (RF24). No cambia el estado del pago.
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numeroRecibo, motivo]
              properties:
                numeroRecibo: { $ref: '#/components/schemas/NumeroRecibo' }
                motivo: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Recibo corregido; queda en la auditoría CORREGIR_RECIBO con el anterior, el nuevo y el motivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Esquela' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /pagos/auditoria:
    get:
      tags: [Pagos]
      operationId: auditoriaPagos
      summary: Pagos y correcciones registrados (RF25, rol JEFATURA).
      description: >-
        Del más reciente al más antiguo; `porPagina` hasta 50; `desde` y `hasta` incluyen el día completo (hora de
        Lima). `referencia` = código de la esquela; `detalle` lleva el recibo anterior, el nuevo y el motivo. Nunca
        datos personales del titular. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Página de registros.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      datos:
                        type: array
                        items: { $ref: '#/components/schemas/RegistroAuditoria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  # ===================================================================== INSPECCIONES
  /inspecciones:
    get:
      tags: [Inspecciones]
      operationId: listarInspecciones
      summary: Bandeja de inspecciones. El inspector ve solo las suyas; la jefatura ve todas.
      description: >-
        Roles JEFATURA (todas) e INSPECTOR (solo las asignadas a él, con la dirección del local). La jefatura
        no recibe la dirección. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - name: estado
          in: query
          schema: { type: string, enum: [PENDIENTE, ASIGNADA, REALIZADA] }
      responses:
        '200':
          description: Página de inspecciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      datos:
                        type: array
                        items: { $ref: '#/components/schemas/Inspeccion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /inspecciones/inspectores:
    get:
      tags: [Inspecciones]
      operationId: listarInspectores
      summary: Usuarios activos con rol INSPECTOR, para asignar (rol JEFATURA).
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Inspectores.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nombre]
                  additionalProperties: false
                  properties:
                    id: { type: string, format: uuid }
                    nombre: { type: string }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /inspecciones/{inspeccionId}/asignar:
    parameters:
      - $ref: '#/components/parameters/InspeccionId'
    post:
      tags: [Inspecciones]
      operationId: asignarInspector
      summary: Asigna el inspector y la fecha (RF10, rol JEFATURA).
      description: >-
        Se puede cambiar la asignación mientras la inspección no tenga resultado (409 si ya lo tiene). 422 si el
        usuario no es un inspector activo o la fecha es anterior a hoy (hora de Lima).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inspectorId, programadaPara]
              properties:
                inspectorId: { type: string, format: uuid }
                programadaPara: { type: string, format: date }
      responses:
        '200':
          description: Inspección asignada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspeccion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /inspecciones/{inspeccionId}/resultado:
    parameters:
      - $ref: '#/components/parameters/InspeccionId'
    post:
      tags: [Inspecciones]
      operationId: registrarResultadoItse
      summary: El inspector asignado registra el resultado con fotos desde su celular (RF10, HU08). Publica ResultadoITSERegistrado.
      description: >-
        Solo el inspector asignado (403 para cualquier otro). Una sola vez (409 si ya tiene resultado). Fotos JPG o
        PNG reales (se comprueba el contenido) de hasta 10 MB. Con FAVORABLE, el número del certificado y su
        fecha de emisión (no futura) son obligatorios; el certificado vence 2 años después. Con DESFAVORABLE, las
        observaciones son obligatorias. `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resultado, fotos]
              properties:
                resultado: { type: string, enum: [FAVORABLE, DESFAVORABLE] }
                observaciones: { type: string, maxLength: 4000 }
                numeroCertificado:
                  type: string
                  pattern: '^[A-Za-z0-9/ -]{4,30}$'
                  description: Obligatorio si es FAVORABLE; se guarda en mayúsculas y sin espacios.
                certificadoEmitidoEn:
                  { type: string, format: date, description: Obligatorio si es FAVORABLE. }
                fotos:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
            encoding:
              fotos:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Resultado registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspeccion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '413':
          description: Una foto supera los 10 MB.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  # ===================================================================== LICENCIAS
  /licencias/verificar/{codigoVerificacion}:
    parameters:
      - name: codigoVerificacion
        in: path
        required: true
        description: Token aleatorio impreso en el QR.
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
    get:
      tags: [Licencias]
      operationId: verificarLicenciaPublica
      summary: Verificación pública del QR con datos mínimos (RF13, ADR-007). Sin DNI, celular ni dirección.
      description: >-
        Un código inexistente o mal formado responde el mismo 404. Tras 10 respuestas 404 desde el mismo origen en
        15 minutos responde 429 (también con un código válido) hasta que pase la ventana; las verificaciones
        exitosas no cuentan. `Cache-Control: no-store`.
      security: []
      responses:
        '200':
          description: Licencia encontrada.
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenciaPublica' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }
        '503':
          description: No se pueden contar los intentos en este momento (falla cerrado).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /licencias/{numeroLicencia}:
    parameters:
      - $ref: '#/components/parameters/NumeroLicencia'
    get:
      tags: [Licencias]
      operationId: obtenerLicencia
      summary: Detalle de la licencia y su certificado ITSE.
      description: >-
        Con una sesión MESA_PARTES, EVALUADOR o JEFATURA, o con el `tokenConsulta` del mismo expediente (403 si es de otro).
        `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }, { tokenConsulta: [] }]
      responses:
        '200':
          description: Licencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Licencia' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /licencias/{numeroLicencia}/pdf:
    parameters:
      - $ref: '#/components/parameters/NumeroLicencia'
    get:
      tags: [Licencias]
      operationId: descargarLicencia
      summary: PDF de la licencia con el código QR (HU06).
      description: >-
        Con el `tokenConsulta` del mismo expediente o una sesión MESA_PARTES, EVALUADOR o JEFATURA. El PDF se genera al pedirlo
        y no lleva documento, RUC, celular, correo ni dirección del titular.
      security: [{ tokenConsulta: [] }, { bearerPersonal: [] }]
      responses:
        '200':
          description: PDF.
          headers:
            Content-Disposition:
              { schema: { type: string }, description: 'attachment; filename="<número>.pdf"' }
            X-Content-Type-Options: { schema: { type: string }, description: nosniff }
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ===================================================================== PLAZOS
  /feriados:
    get:
      tags: [Plazos]
      operationId: listarFeriados
      summary: Feriados de un año, por fecha (cualquier sesión del personal).
      security: [{ bearerPersonal: [] }]
      parameters:
        - name: anio
          in: query
          required: true
          schema: { type: integer, minimum: 2024, maximum: 2100 }
      responses:
        '200':
          description: Feriados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feriado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    post:
      tags: [Plazos]
      operationId: registrarFeriado
      summary: Registra un feriado (RF23, rol ADMINISTRADOR).
      security: [{ bearerPersonal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Feriado' }
      responses:
        '201':
          description: Feriado registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feriado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /feriados/{fecha}:
    parameters:
      - name: fecha
        in: path
        required: true
        schema: { type: string, format: date }
    delete:
      tags: [Plazos]
      operationId: eliminarFeriado
      summary: Elimina un feriado registrado por error (rol ADMINISTRADOR).
      security: [{ bearerPersonal: [] }]
      responses:
        '204': { description: Feriado eliminado. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /plazos/alertas:
    get:
      tags: [Plazos]
      operationId: listarAlertas
      summary: Expedientes próximos a vencer (RF08, HU09, rol JEFATURA).
      description: >-
        De la más urgente a la menos urgente (las vencidas primero). `diasHabilesRestantes` se recalcula al leer.
        `Cache-Control: no-store`.
      security: [{ bearerPersonal: [] }]
      parameters:
        - name: pendientes
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Alertas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertaPlazo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /plazos/alertas/{alertaId}/atender:
    parameters:
      - name: alertaId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Plazos]
      operationId: atenderAlerta
      summary: Marca una alerta como atendida (rol JEFATURA); queda quién y cuándo.
      security: [{ bearerPersonal: [] }]
      responses:
        '200':
          description: Alerta atendida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaPlazo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ===================================================================== REPORTES
  /reportes/tablero:
    get:
      tags: [Reportes]
      operationId: obtenerTablero
      summary: Trámites, tiempos de atención frente al plazo del TUPA e ingresos en caja (RF19, HU10).
      security: [{ bearerPersonal: [] }]
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Indicadores.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablero' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /reportes/licencias:
    get:
      tags: [Reportes]
      operationId: reporteLicencias
      summary: Licencias vigentes, en trámite y con ITSE por vencer, por tipo, giro y zona (RF18).
      security: [{ bearerPersonal: [] }]
      parameters:
        - name: situacion
          in: query
          required: true
          schema: { type: string, enum: [VIGENTES, EN_TRAMITE, ITSE_POR_VENCER] }
        - $ref: '#/components/parameters/CodigoRecetaFiltro'
        - { name: giro, in: query, schema: { type: string } }
        - { name: zona, in: query, schema: { type: string } }
        - name: formato
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Reporte.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FilaReporte' }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ===================================================================== OPERACIÓN
  /salud:
    get:
      tags: [Operación]
      operationId: salud
      summary: Chequeo de salud para Nginx y Uptime Kuma (EQ-03). Verifica PostgreSQL y Redis.
      security: []
      responses:
        '200':
          description: Servicio sano (OK) o degradado (DEGRADADO, solo falla la caché; la instancia sigue recibiendo tráfico, ADR-005).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: La base de datos no responde; el balanceador deja de enviar tráfico a esta instancia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

components:
  securitySchemes:
    bearerPersonal:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso del personal (15 minutos). Incluye el id del usuario, el id de la sesión y los roles; nunca datos personales.
    tokenIdentidad:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de 30 minutos del administrado con identidad confirmada (RF06).
    tokenConsulta:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de 15 minutos para leer un solo expediente después de la consulta pública (RF03).
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refresh_personal
      description: Refresh token opaco del personal en una cookie HttpOnly, Secure y SameSite=Strict con Path=/api/v1/auth. JavaScript no puede leerla.

  headers:
    CookieRefresh:
      description: |
        `refresh_personal=<valor>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<segundos hasta el máximo de 8 horas>`.
        Al cerrar sesión se envía con `Max-Age=0` para borrarla.
      schema: { type: string }

  parameters:
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: porPagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    NumeroExpediente:
      name: numeroExpediente
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NumeroExpediente' }
    CodigoReceta:
      name: codigoReceta
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CodigoReceta' }
    CodigoRecetaFiltro:
      name: codigoReceta
      in: query
      schema: { $ref: '#/components/schemas/CodigoReceta' }
    CodigoEsquela:
      name: codigoEsquela
      in: path
      required: true
      schema: { type: string, pattern: '^ESQ-EXP-[0-9]{4}-[0-9]{6}$', example: ESQ-EXP-2026-000001 }
    NumeroLicencia:
      name: numeroLicencia
      in: path
      required: true
      schema: { type: string, pattern: '^LF-[0-9]{4}-[0-9]{6}$', example: LF-2026-000001 }
    InspeccionId:
      name: inspeccionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID generado por el Portal. Si la red falla y se reintenta, la operación no se repite.
      schema: { type: string, format: uuid }
    ClaveIdempotenciaObligatoria:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el Portal por cada intento de presentación; se reutiliza en los reintentos (FR-020).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión del expediente leída (bloqueo optimista). Si otro usuario lo cambió, responde 412.
      schema: { type: string }

  responses:
    NoAutenticado:
      description: Falta el token, venció o las credenciales son incorrectas.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SinPermiso:
      description: El rol del usuario no permite esta operación (EQ-04).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso no existe o los datos no coinciden.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: La operación no corresponde al estado actual (por ejemplo, ya fue pagada o el expediente no está en evaluación).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    VersionCambiada:
      description: Otro usuario modificó el expediente; volver a leerlo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoProcesable:
      description: Los datos no cumplen las reglas de validación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    DemasiadosIntentos:
      description: Se superaron 5 intentos fallidos o 3 envíos de código en 15 minutos (ADR-007, FR-002a).
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos para volver a intentar.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    UltimoAdministrador:
      description: La operación dejaría al sistema sin ningún administrador activo (`type` termina en `ultimo-administrador`, FR-020).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ServicioNoDisponible:
      description: El inicio de sesión no puede comprobar los límites de intentos o enviar el código en este momento.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    # ------------------------------------------------------------- tipos básicos
    Rol:
      type: string
      enum: [MESA_PARTES, EVALUADOR, INSPECTOR, CAJA, JEFATURA, ADMINISTRADOR]
    Ruta:
      type: string
      enum: [A, B, C]
    NivelRiesgo:
      type: string
      enum: [BAJO, MEDIO, ALTO, MUY_ALTO]
    CodigoReceta:
      type: string
      pattern: '^(LIC-0[1-9]|TRF-01|CGI-01|DUP-01)$'
      example: LIC-01
    NumeroExpediente:
      type: string
      pattern: '^EXP-[0-9]{4}-[0-9]{6}$'
      example: EXP-2026-000001
    NumeroRecibo:
      type: string
      pattern: '^[A-Z0-9-]{4,30}$'
      example: REC-000123
    Celular:
      type: string
      pattern: '^9[0-9]{8}$'
      example: '987654321'
    Clave:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).+$'
      description: Al menos 12 caracteres, con letras y números (FR-022a).
    Soles:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Monto en soles como texto con 2 decimales, para no perder precisión.
      example: '159.50'
    EstadoExpediente:
      type: string
      enum:
        [
          REGISTRADO,
          OBSERVADO,
          EN_EVALUACION,
          PENDIENTE_PAGO,
          PAGADO,
          EN_INSPECCION,
          APROBADO,
          LICENCIA_PROVISIONAL,
          LICENCIA_EMITIDA,
          ITSE_POSTERIOR_PENDIENTE,
          FINALIZADO,
          DENEGADO,
          DERIVADO_A_FISCALIZACION,
        ]

    Problema:
      type: object
      description: Error en formato RFC 9457. Nunca incluye datos personales.
      required: [type, title, status]
      properties:
        type:
          {
            type: string,
            format: uri,
            example: 'https://licencias.example.pe/errores/esquela-ya-pagada',
          }
        title: { type: string, example: Esta esquela ya fue pagada }
        status: { type: integer, example: 409 }
        detail: { type: string }
        instance: { type: string }
        errores:
          type: array
          description: Errores de validación por campo (solo en 422).
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: { type: string }
              mensaje: { type: string }

    Paginacion:
      type: object
      required: [pagina, porPagina, total]
      properties:
        pagina: { type: integer }
        porPagina: { type: integer }
        total: { type: integer }

    # ------------------------------------------------------------- seguridad
    CredencialesPersonal:
      type: object
      required: [correo, clave]
      properties:
        correo: { type: string, format: email }
        clave: { type: string, minLength: 1, maxLength: 128, format: password }
    DesafioOtp:
      type: object
      required: [desafioId, venceEn, celularEnmascarado]
      properties:
        desafioId: { type: string, format: uuid }
        venceEn: { type: string, format: date-time }
        celularEnmascarado: { type: string, example: '9*****321' }
    VerificacionOtp:
      type: object
      required: [desafioId, codigo]
      properties:
        desafioId: { type: string, format: uuid }
        codigo: { type: string, pattern: '^[0-9]{6}$' }
    SesionPersonal:
      type: object
      description: El refresh token no viaja en el cuerpo; va en la cookie `refresh_personal`.
      required: [accessToken, expiraEn, debeCambiarClave, usuario]
      properties:
        accessToken: { type: string }
        expiraEn: { type: integer, description: Segundos de vida del accessToken (900). }
        debeCambiarClave:
          { type: boolean, description: 'Si es true, solo se permite cambiar la clave (FR-022).' }
        usuario: { $ref: '#/components/schemas/Usuario' }
    CambioClave:
      type: object
      required: [claveActual, claveNueva]
      additionalProperties: false
      properties:
        claveActual: { type: string, format: password, minLength: 1, maxLength: 128 }
        claveNueva: { $ref: '#/components/schemas/Clave' }
    TokenCorto:
      type: object
      required: [token, expiraEn]
      properties:
        token: { type: string }
        expiraEn: { type: integer, example: 900 }
    SolicitudVerificacionIdentidad:
      type: object
      required: [tipoDocumento, numeroDocumento, ruc, celular]
      properties:
        tipoDocumento: { type: string, enum: [DNI, CE] }
        numeroDocumento: { type: string, pattern: '^[0-9A-Z]{8,12}$' }
        fechaEmision: { type: string, format: date, description: Obligatoria para DNI. }
        ruc: { type: string, pattern: '^(10|15|17|20)[0-9]{9}$' }
        celular: { $ref: '#/components/schemas/Celular' }
        representante:
          type: object
          description: Solo si actúa un representante legal o apoderado (RF06).
          required: [tipoDocumento, numeroDocumento]
          properties:
            tipoDocumento: { type: string, enum: [DNI, CE] }
            numeroDocumento: { type: string, pattern: '^[0-9A-Z]{8,12}$' }
            fechaEmision: { type: string, format: date }

    # ------------------------------------------------------------- usuarios
    Usuario:
      type: object
      required: [id, correo, nombreCompleto, celularEnmascarado, roles, activo, debeCambiarClave]
      properties:
        id: { type: string, format: uuid }
        correo: { type: string, format: email }
        nombreCompleto: { type: string }
        celularEnmascarado:
          {
            type: string,
            example: '9*****321',
            description: El celular nunca se devuelve completo (FR-028).,
          }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Rol' }
        activo: { type: boolean }
        debeCambiarClave: { type: boolean }
    NuevoUsuario:
      type: object
      required: [correo, nombreCompleto, celular, claveTemporal, roles]
      additionalProperties: false
      properties:
        correo: { type: string, format: email, maxLength: 120 }
        nombreCompleto: { type: string, minLength: 3, maxLength: 150 }
        celular: { $ref: '#/components/schemas/Celular' }
        claveTemporal: { $ref: '#/components/schemas/Clave' }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Rol' }
    BusquedaUsuarios:
      type: object
      additionalProperties: false
      properties:
        texto:
          {
            type: string,
            minLength: 2,
            maxLength: 150,
            description: Fragmento del nombre o correo completo.,
          }
        activo: { type: boolean }
        pagina: { type: integer, minimum: 1, default: 1 }
        porPagina: { type: integer, minimum: 1, maximum: 100, default: 20 }

    # ------------------------------------------------------------- catálogo
    RecetaResumen:
      type: object
      required: [codigo, nombre, tipo, tasa]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoReceta' }
        nombre: { type: string }
        tipo: { type: string, enum: [LICENCIA, TRAMITE_CONECTADO] }
        ruta: { oneOf: [{ $ref: '#/components/schemas/Ruta' }, { type: 'null' }] }
        tasa: { $ref: '#/components/schemas/Soles' }
        plazoDias: { type: [integer, 'null'] }
    Receta:
      allOf:
        - $ref: '#/components/schemas/RecetaResumen'
        - type: object
          required: [codigoTupa, paginaTupa, calificacion, requisitos]
          properties:
            codigoTupa: { type: string, example: PE1027344C1 }
            paginaTupa: { type: integer, example: 368 }
            nivelRiesgo: { oneOf: [{ $ref: '#/components/schemas/NivelRiesgo' }, { type: 'null' }] }
            tipoPlazo: { type: string, enum: [HABILES, CALENDARIO] }
            calificacion:
              {
                type: string,
                enum:
                  [APROBACION_AUTOMATICA, EVALUACION_PREVIA_SILENCIO_POSITIVO, SERVICIO_EXCLUSIVO],
              }
            ordenItse: { type: [string, 'null'], enum: [POSTERIOR, PREVIA, DENTRO_6_MESES, null] }
            plazoItseDias: { type: [integer, 'null'] }
            vigenciaMeses: { type: [integer, 'null'], description: null = indeterminada }
            requisitos:
              type: array
              items: { $ref: '#/components/schemas/Requisito' }
    RecetaAdminResumen:
      allOf:
        - $ref: '#/components/schemas/RecetaResumen'
        - type: object
          required: [activa, actualizadaEn]
          properties:
            activa: { type: boolean }
            actualizadaEn: { type: string, format: date-time }
    RecetaAdmin:
      allOf:
        - $ref: '#/components/schemas/Receta'
        - type: object
          required: [activa, actualizadaEn]
          properties:
            activa: { type: boolean }
            actualizadaEn: { type: string, format: date-time }
    ResultadoAsistente:
      description: Resultado del asistente de ruta. NO_DETERMINADA no es un error (FR-006).
      oneOf:
        - $ref: '#/components/schemas/PropuestaLicencia'
        - $ref: '#/components/schemas/LicenciaNoDeterminada'
      discriminator:
        propertyName: resultado
        mapping:
          PROPUESTA: '#/components/schemas/PropuestaLicencia'
          NO_DETERMINADA: '#/components/schemas/LicenciaNoDeterminada'
    PropuestaLicencia:
      type: object
      required: [resultado, receta]
      additionalProperties: false
      properties:
        resultado: { type: string, const: PROPUESTA }
        receta: { $ref: '#/components/schemas/Receta' }
    LicenciaNoDeterminada:
      type: object
      required: [resultado, motivo]
      additionalProperties: false
      properties:
        resultado: { type: string, const: NO_DETERMINADA }
        motivo: { type: string, enum: [SIN_REGLA, RECETA_NO_DISPONIBLE] }
    RecetaEditable:
      type: object
      description: >-
        Campos que el administrador puede cambiar cuando se modifica el TUPA. Los demás (código, nombre,
        tipo, ruta, código y página del TUPA) no se editan. La calificación y el orden del ITSE deben
        corresponder a la ruta de la licencia (FR-019).
      minProperties: 1
      additionalProperties: false
      properties:
        tasa: { $ref: '#/components/schemas/Soles' }
        plazoDias: { type: integer, minimum: 1 }
        calificacion:
          {
            type: string,
            enum: [APROBACION_AUTOMATICA, EVALUACION_PREVIA_SILENCIO_POSITIVO, SERVICIO_EXCLUSIVO],
          }
        ordenItse: { type: [string, 'null'], enum: [POSTERIOR, PREVIA, DENTRO_6_MESES, null] }
        plazoItseDias: { type: [integer, 'null'], minimum: 1 }
        vigenciaMeses: { type: [integer, 'null'], minimum: 1, description: null = indeterminada }
        activa: { type: boolean }
        requisitos:
          type: array
          minItems: 1
          maxItems: 30
          description: >-
            Reemplaza la lista completa. El orden lo da la posición. Con id se conserva ese requisito;
            sin id se crea uno nuevo; los que faltan se borran.
          items:
            type: object
            required: [descripcion, condicion]
            additionalProperties: false
            properties:
              id: { type: integer }
              orden:
                {
                  type: integer,
                  minimum: 1,
                  deprecated: true,
                  description: Se ignora; manda la posición en la lista.,
                }
              descripcion: { type: string, minLength: 1, maxLength: 500 }
              obligatorio: { type: boolean, default: true }
              condicion:
                {
                  type: string,
                  enum: [SIEMPRE, CON_REPRESENTANTE, GIRO_ESPECIAL, SIN_PLANOS_VIGENTES],
                }
    Requisito:
      type: object
      required: [id, orden, descripcion, obligatorio, condicion]
      properties:
        id: { type: integer }
        orden: { type: integer }
        descripcion: { type: string }
        obligatorio: { type: boolean }
        condicion:
          { type: string, enum: [SIEMPRE, CON_REPRESENTANTE, GIRO_ESPECIAL, SIN_PLANOS_VIGENTES] }
    PreguntaAsistente:
      type: object
      required: [codigo, orden, texto, opciones]
      properties:
        codigo: { type: string, example: TIPO_ESTABLECIMIENTO }
        orden: { type: integer }
        texto: { type: string }
        opciones:
          type: array
          items:
            type: object
            required: [valor, texto]
            properties:
              valor: { type: string }
              texto: { type: string }

    # ------------------------------------------------------------- trámites
    DocumentoAdjunto:
      type: object
      required: [requisitoId, documentoId]
      properties:
        requisitoId: { type: integer }
        documentoId: { type: string, format: uuid, description: Id devuelto por POST /documentos. }
    NuevaSolicitud:
      type: object
      required: [codigoReceta, identidad, nombreTitular, giro, direccion, zona, documentos]
      additionalProperties: false
      properties:
        codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
        expedienteOrigen:
          description: Solo para trámites conectados (RF15).
          oneOf: [{ $ref: '#/components/schemas/NumeroExpediente' }, { type: 'null' }]
        nombreTitular: { type: string, maxLength: 150 }
        razonSocial: { type: [string, 'null'], maxLength: 200 }
        correo: { type: [string, 'null'], format: email }
        nombreComercial: { type: [string, 'null'], maxLength: 200 }
        giro: { type: string, maxLength: 150 }
        direccion: { type: string, maxLength: 300 }
        zona: { type: string, maxLength: 60 }
        areaM2: { type: [number, 'null'], exclusiveMinimum: 0 }
        identidad:
          description: >-
            En línea debe coincidir con la identidad confirmada del tokenIdentidad; en mesa de partes se
            comprueba con el servicio de identificación (research §R-05 de la 004).
          $ref: '#/components/schemas/SolicitudVerificacionIdentidad'
        documentos:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/DocumentoAdjunto' }
    ExpedienteRegistrado:
      type: object
      required:
        [
          numero,
          estado,
          ruta,
          codigoReceta,
          nombreLicencia,
          canal,
          presentadoEn,
          vencePlazoEn,
          siguientePaso,
        ]
      properties:
        numero: { $ref: '#/components/schemas/NumeroExpediente' }
        estado: { $ref: '#/components/schemas/EstadoExpediente' }
        ruta: { $ref: '#/components/schemas/Ruta' }
        codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
        nombreLicencia: { type: string }
        canal: { type: string, enum: [EN_LINEA, MESA_PARTES] }
        presentadoEn: { type: string, format: date-time }
        vencePlazoEn:
          {
            type: [string, 'null'],
            format: date,
            description: Vacío hasta la funcionalidad 008 (FR-022).,
          }
        siguientePaso: { type: string }
    ExpedienteResumen:
      type: object
      required: [numero, estado, ruta, codigoReceta, nombreTitular, presentadoEn]
      properties:
        numero: { $ref: '#/components/schemas/NumeroExpediente' }
        estado: { $ref: '#/components/schemas/EstadoExpediente' }
        ruta: { $ref: '#/components/schemas/Ruta' }
        codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
        nombreTitular: { type: string }
        giro: { type: string }
        presentadoEn: { type: string, format: date-time }
        vencePlazoEn: { type: [string, 'null'], format: date }
        diasHabilesRestantes: { type: [integer, 'null'] }
    Expediente:
      allOf:
        - $ref: '#/components/schemas/ExpedienteResumen'
        - type: object
          required: [version, canal, documentos, historial]
          properties:
            version: { type: integer, description: Se envía en If-Match al decidir. }
            canal: { type: string, enum: [EN_LINEA, MESA_PARTES] }
            nivelRiesgoPropuesto:
              { oneOf: [{ $ref: '#/components/schemas/NivelRiesgo' }, { type: 'null' }] }
            nivelRiesgoConfirmado:
              { oneOf: [{ $ref: '#/components/schemas/NivelRiesgo' }, { type: 'null' }] }
            documentoTitularEnmascarado: { type: string, example: '4*****21' }
            razonSocial: { type: [string, 'null'] }
            nombreComercial: { type: [string, 'null'] }
            direccion:
              {
                type: string,
                description: 'Solo para el personal con acceso al detalle (mesa de partes, evaluador y jefatura); la consulta pública nunca la muestra.',
              }
            zona: { type: string }
            areaM2: { type: [number, 'null'] }
            codigoEsquela: { type: [string, 'null'] }
            numeroLicencia: { type: [string, 'null'] }
            documentos:
              type: array
              items:
                type: object
                required: [id, requisitoId, nombreOriginal, tipoMime]
                properties:
                  id: { type: string, format: uuid }
                  requisitoId: { type: integer }
                  nombreOriginal: { type: string }
                  tipoMime: { type: string }
            observaciones:
              type: array
              items:
                type: object
                properties:
                  descripcion: { type: string }
                  plazoSubsanarEn: { type: [string, 'null'], format: date }
                  subsanadaEn: { type: [string, 'null'], format: date-time }
            licenciasDelGrupo:
              description: >-
                Licencias vigentes a las que el evaluador puede corregir el riesgo (mismo grupo, incluida la actual).
                Solo con el expediente EN_EVALUACION; vacía en otro estado (005).
              type: array
              items:
                type: object
                required: [codigoReceta, nombre, tasa, ruta]
                properties:
                  codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
                  nombre: { type: string }
                  tasa: { $ref: '#/components/schemas/Soles' }
                  ruta: { $ref: '#/components/schemas/Ruta' }
            historial:
              type: array
              items:
                type: object
                required: [estadoNuevo, ocurridoEn]
                properties:
                  estadoAnterior: { type: [string, 'null'] }
                  estadoNuevo: { type: string }
                  comentario: { type: [string, 'null'] }
                  ocurridoEn: { type: string, format: date-time }
    EstadoPublico:
      type: object
      description: Lo que ve el administrado al consultar (RF03). Nunca documento, RUC, celular, correo ni dirección (FR-033).
      required: [numero, estado, descripcionEstado, ruta, nombreLicencia, presentadoEn, historial]
      additionalProperties: false
      properties:
        numero: { $ref: '#/components/schemas/NumeroExpediente' }
        estado: { $ref: '#/components/schemas/EstadoExpediente' }
        descripcionEstado:
          { type: string, example: Tu solicitud fue registrada y espera evaluación }
        presentadoEn: { type: string, format: date-time }
        historial:
          type: array
          items:
            type: object
            required: [estado, descripcion, ocurridoEn]
            additionalProperties: false
            properties:
              estado: { $ref: '#/components/schemas/EstadoExpediente' }
              descripcion: { type: string }
              ocurridoEn: { type: string, format: date-time }
        ruta: { $ref: '#/components/schemas/Ruta' }
        nombreLicencia: { type: string }
        vencePlazoEn: { type: [string, 'null'], format: date }
        siguientePaso: { type: string, example: Paga la esquela en la caja municipal }
        codigoEsquela: { type: [string, 'null'] }
        montoEsquela: { oneOf: [{ $ref: '#/components/schemas/Soles' }, { type: 'null' }] }
        esquelaPagada: { type: boolean }
        numeroLicencia: { type: [string, 'null'] }
        observacionesPendientes:
          type: array
          items: { type: string }
        requisitosSubsanables:
          description: >-
            Solo cuando el expediente está OBSERVADO: requisitos de la receta guardada al presentar a los que
            se pueden adjuntar documentos al subsanar (005, historia 4).
          type: array
          items:
            type: object
            required: [id, descripcion]
            additionalProperties: false
            properties:
              id: { type: integer }
              descripcion: { type: string }
        tokenConsulta:
          description: >-
            Cuando el expediente está PENDIENTE_PAGO (esquela, 005) o tiene licencia (LICENCIA_EMITIDA, LICENCIA_PROVISIONAL,
            ITSE_POSTERIOR_PENDIENTE, FINALIZADO o DERIVADO_A_FISCALIZACION, 006); sirve 15 minutos y solo para ese expediente.
          $ref: '#/components/schemas/TokenCorto'
    RegistroAuditoria:
      type: object
      required: [usuarioId, accion, ocurridoEn]
      properties:
        usuarioId: { type: [string, 'null'], format: uuid }
        nombreUsuario: { type: [string, 'null'] }
        accion: { type: string }
        referencia: { type: string, description: 'Expediente, esquela o inspección.' }
        detalle: { type: [object, 'null'] }
        ocurridoEn: { type: string, format: date-time }

    # ------------------------------------------------------------- pagos
    Esquela:
      type: object
      required: [codigo, numeroExpediente, concepto, monto, pagada, generadaEn]
      properties:
        codigo: { type: string, example: ESQ-EXP-2026-000001 }
        numeroExpediente: { $ref: '#/components/schemas/NumeroExpediente' }
        concepto: { type: string }
        monto: { $ref: '#/components/schemas/Soles' }
        pagada: { type: boolean }
        numeroRecibo: { type: [string, 'null'] }
        pagadaEn: { type: [string, 'null'], format: date-time }
        generadaEn: { type: string, format: date-time }
        nombreLicencia: { type: string, description: 'Igual al concepto (005).' }
        estadoExpediente: { $ref: '#/components/schemas/EstadoExpediente' }

    # ------------------------------------------------------------- inspecciones
    Inspeccion:
      type: object
      required: [id, numeroExpediente, tipo, estado]
      properties:
        id: { type: string, format: uuid }
        numeroExpediente: { $ref: '#/components/schemas/NumeroExpediente' }
        tipo: { type: string, enum: [PREVIA, POSTERIOR, BODEGA] }
        estado: { type: string, enum: [PENDIENTE, ASIGNADA, REALIZADA] }
        inspectorId: { type: [string, 'null'], format: uuid }
        programadaPara: { type: [string, 'null'], format: date }
        nombreInspector: { type: [string, 'null'] }
        direccion: { type: string, description: Solo para el inspector asignado (la necesita para ir). }
        giro: { type: string }
        nombreLicencia: { type: string }
        resultado: { type: [string, 'null'], enum: [FAVORABLE, DESFAVORABLE, null] }
        observaciones: { type: [string, 'null'] }
        numeroCertificado: { type: [string, 'null'] }
        certificadoEmitidoEn: { type: [string, 'null'], format: date }
        registradaEn: { type: [string, 'null'], format: date-time }

    # ------------------------------------------------------------- licencias
    LicenciaPublica:
      type: object
      description: Datos mínimos que muestra la página del QR (ADR-007).
      required: [numero, tipo, estado, titular, giro, emitidaEn]
      properties:
        numero: { type: string, example: LF-2026-000001 }
        tipo: { type: string, enum: [DEFINITIVA, PROVISIONAL] }
        estado: { type: string, enum: [VIGENTE, REEMPLAZADA, VENCIDA] }
        titular: { type: string, description: Razón social o nombre con apellidos abreviados. }
        nombreComercial: { type: [string, 'null'] }
        giro: { type: string }
        zona: { type: string }
        emitidaEn: { type: string, format: date }
        vigenteHasta: { type: [string, 'null'], format: date }
        itseVenceEn: { type: [string, 'null'], format: date }
        itseEstado: { type: string, enum: [SIN_CERTIFICADO, VIGENTE, VENCIDO] }
    Licencia:
      allOf:
        - $ref: '#/components/schemas/LicenciaPublica'
        - type: object
          required: [numeroExpediente, codigoReceta]
          properties:
            numeroExpediente: { $ref: '#/components/schemas/NumeroExpediente' }
            codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
            urlVerificacion: { type: string, format: uri }
            certificadoItse:
              type: [object, 'null']
              properties:
                numero: { type: string }
                emitidoEn: { type: string, format: date }
                venceEn: { type: string, format: date }

    # ------------------------------------------------------------- plazos
    Feriado:
      type: object
      required: [fecha, descripcion, alcance]
      properties:
        fecha: { type: string, format: date }
        descripcion: { type: string, maxLength: 150 }
        alcance: { type: string, enum: [NACIONAL, REGIONAL, LOCAL] }
    AlertaPlazo:
      type: object
      required: [id, numeroExpediente, venceEn, diasHabilesRestantes, generadaEn]
      properties:
        id: { type: integer }
        numeroExpediente: { $ref: '#/components/schemas/NumeroExpediente' }
        venceEn: { type: string, format: date }
        diasHabilesRestantes: { type: integer }
        estadoExpediente: { $ref: '#/components/schemas/EstadoExpediente' }
        generadaEn: { type: string, format: date-time }
        atendidaEn: { type: [string, 'null'], format: date-time }
        atendidaPor: { type: [string, 'null'], format: uuid }

    # ------------------------------------------------------------- reportes y operación
    Tablero:
      type: object
      required: [expedientesPorEstado, tiempoPromedioPorReceta, ingresos]
      properties:
        expedientesPorEstado:
          type: object
          additionalProperties: { type: integer }
        tiempoPromedioPorReceta:
          type: array
          items:
            type: object
            required: [codigoReceta, plazoTupaDias, promedioDiasHabiles, dentroDelPlazo]
            properties:
              codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
              plazoTupaDias: { type: integer }
              promedioDiasHabiles: { type: number }
              dentroDelPlazo:
                { type: number, description: Porcentaje de expedientes atendidos dentro del plazo. }
        ingresos:
          type: object
          required: [total, porReceta]
          properties:
            total: { $ref: '#/components/schemas/Soles' }
            porReceta:
              type: object
              additionalProperties: { $ref: '#/components/schemas/Soles' }
    FilaReporte:
      type: object
      properties:
        numero: { type: string }
        codigoReceta: { $ref: '#/components/schemas/CodigoReceta' }
        titular: { type: string }
        giro: { type: string }
        zona: { type: string }
        estado: { type: string }
        fecha: { type: string, format: date }
    Salud:
      type: object
      required: [estado, baseDeDatos, cache]
      properties:
        estado: { type: string, enum: [OK, DEGRADADO, CAIDO] }
        baseDeDatos: { type: string, enum: [OK, CAIDO] }
        cache:
          {
            type: string,
            enum: [OK, CAIDO],
            description: 'Si Redis falla el servicio sigue (DEGRADADO), ADR-005.',
          }
        version: { type: string }
