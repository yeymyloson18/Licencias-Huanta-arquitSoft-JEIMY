# Configuración principal de nginx del portal (proxy de desarrollo y de la prueba de carga).
# Reemplaza /etc/nginx/nginx.conf de la imagen oficial para subir los límites de conexiones: con los
# valores por defecto (1,024 conexiones por proceso) el proxy se queda sin conexiones cerca de 2,000
# usuarios simultáneos, porque cada petición usa dos (cliente → nginx y nginx → API).
user nginx;
worker_processes auto;
worker_rlimit_nofile 32768;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    include /etc/nginx/conf.d/*.conf;
}
