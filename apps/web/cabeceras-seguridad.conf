# Cabeceras de seguridad del portal (EQ-04; escaneo OWASP ZAP de la 002, research.md §R-18).
# Se incluye en cada `location`: en nginx, un `add_header` dentro de una location anula los
# heredados del bloque `server`. `always` las agrega también a las respuestas de error.
#
# CSP: todo se sirve desde el mismo origen (la API va por /api/ y no hay CDN ni fuentes externas).
# React aplica estilos por CSSOM, que la directiva style-src 'self' no bloquea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Ninguna pantalla usa todavía cámara, micrófono ni ubicación; se habilitarán cuando el inspector
# las necesite.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
