# Réplicas de la API (docker compose --scale api=N): nginx resuelve "api" al arrancar y reparte entre
# todas sus direcciones. Conexiones persistentes hacia la API para no abrir una conexión TCP nueva
# por cada petición (con 2,000 usuarios se agotaban los puertos y las conexiones del proxy).
upstream api_replicas {
    server api:3000;
    keepalive 128;
    # Menor que el keepAliveTimeout de Node (5 s): nginx cierra antes y nunca reutiliza una conexión
    # que la API ya cerró (evita 502 esporádicos).
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # No anunciar la versión de nginx (ZAP 10036).
    server_tokens off;

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Documentación interactiva de la API (008): misma API, con su propia CSP (cabeceras-docs.conf).
    # Las cabeceras que ya pone la API se ocultan para no duplicarlas.
    location /api/docs {
        proxy_pass http://api_replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        include /etc/nginx/snippets/cabeceras-docs.conf;
    }

    # La API se sirve desde el mismo origen: el portal llama a /api/v1/... (sin CORS).
    location /api/ {
        # Documentos de hasta 10 MB más los encabezados del multipart (004, research §R-08).
        client_max_body_size 11m;
        proxy_pass http://api_replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # IP real del cliente para los límites de intentos por origen (FR-007); la API confía en
        # este salto con TRUST_PROXY_SALTOS=1 (research.md §R-08 de la 002).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html, que no se guarda en caché.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        try_files $uri /index.html;
    }
}
