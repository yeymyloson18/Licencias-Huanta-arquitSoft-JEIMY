server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API se sirve desde el mismo origen: el portal llama a /api/v1/... (sin CORS).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # IP real del cliente para los límites de intentos por origen (FR-007); la API confía en
        # este salto con TRUST_PROXY_SALTOS=1 (research.md §R-08 de la 002).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html, que no se guarda en caché.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
